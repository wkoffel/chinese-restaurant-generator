</div>
<script>
  // same bulb layout as the app
  const f = document.getElementById("bulb-frame"), box = document.getElementById("bulbs");
  const w = f.clientWidth, h = f.clientHeight, inset = 8, sp = 24, iw = w - 16, ih = h - 16;
  const nx = Math.round(iw / sp), ny = Math.round(ih / sp), pts = [];
  for (let i = 0; i < nx; i++) pts.push([inset + iw * i / nx, inset]);
  for (let i = 0; i < ny; i++) pts.push([inset + iw, inset + ih * i / ny]);
  for (let i = 0; i < nx; i++) pts.push([inset + iw - iw * i / nx, inset + ih]);
  for (let i = 0; i < ny; i++) pts.push([inset, inset + ih - ih * i / ny]);
  pts.forEach(([x, y]) => { const b = document.createElement("span"); b.className = "bulb"; b.style.left = x + "px"; b.style.top = y + "px"; box.append(b); });
</script>
</body>
</html>
