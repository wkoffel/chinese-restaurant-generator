<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Name Generator</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #c8102e; color: #ffd700; font-family: Georgia, serif; text-align: center; }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 1rem; text-shadow: 3px 3px 0 #000; }
    button { font-size: 1.5rem; padding: .75rem 2rem; border: 4px solid #ffd700; border-radius: 999px;
             background: #000; color: #ffd700; cursor: pointer; }
    small { display: block; margin-top: 2rem; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1 id="name">Golden Panda</h1>
    <button id="spin">Spin!</button>
    <small>Deployment test page &middot; JS is <span id="js">not</span> running</small>
  </main>
  <script>
    const a = ["China", "Golden", "Panda", "Jade", "Lucky", "Dragon"];
    const b = ["Garden", "Palace", "Wok", "Lotus", "Express", "Buffet"];
    const pick = l => l[Math.floor(Math.random() * l.length)];
    document.getElementById("js").textContent = "";
    document.getElementById("spin").onclick = () =>
      document.getElementById("name").textContent = pick(a) + " " + pick(b);
  </script>
</body>
</html>
